<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="The movies, shows, games and books you actually intend to get to." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>On Deck</title>
    <!-- Image and API hosts used on first paint: open the connections early. -->
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="preconnect" href="https://images.igdb.com" />
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <script>
      // Apply saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('ondeck.theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
