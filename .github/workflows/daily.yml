# Runs On Deck's `daily` Edge Function by hand (Actions → Run workflow). The 3-hourly schedule is Supabase's
# pg_cron (supabase/migrations/20261210000000_job_schedule.sql), which calls the function directly; GitHub's own
# timer ran it hours late. The function refreshes titles whose release dates can still change, each user's
# availability and game prices, and writes inbox notifications.
# Needs repo secrets VITE_SUPABASE_URL and JOB_SECRET (same value as the Supabase secret JOB_SECRET).
name: Daily refresh and notifications

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run the daily job
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
        run: |
          if [ -z "$JOB_SECRET" ]; then echo "::warning::JOB_SECRET is not set — skipping."; exit 0; fi
          status=$(curl -s -o result.json -w '%{http_code}' --max-time 180 -X POST "$SUPABASE_URL/functions/v1/daily" \
            -H "x-job-secret: $JOB_SECRET" -H 'content-type: application/json' -d '{}')
          cat result.json; echo
          if [ "$status" != "200" ]; then echo "::error::daily job returned HTTP $status"; exit 1; fi
